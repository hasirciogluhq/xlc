name: release

# Builds xlc for macOS, Linux and Windows and publishes a GitHub release.
#
#   v1.2.3        stable release  (latest)
#   v1.2.3-rc.4   preview release (marked "pre-release", never "latest")
#
# The tag must equal XLC_VERSION in src/session/session.xl. Re-run an existing tag with
# workflow_dispatch.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v1.0.0-rc.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - id: meta
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "error: tag '$TAG' must be vX.Y.Z (stable) or vX.Y.Z-rc.N (preview)" >&2
            exit 1
          fi
          version="${TAG#v}"
          declared="$(sed -n 's/^export const XLC_VERSION: str = "\(.*\)"$/\1/p' src/session/session.xl)"
          if [ "$declared" != "$version" ]; then
            echo "error: src/session/session.xl declares '$declared' but the tag is '$TAG'" >&2
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-rc.* ]] && prerelease=true
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    needs: meta
    runs-on: ${{ matrix.runner }}
    # One failing platform must not cancel the others; the release step decides what to publish.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15,         os: darwin,  arch: arm64 }
          - { runner: macos-15-intel,   os: darwin,  arch: amd64 }
          - { runner: ubuntu-24.04,     os: linux,   arch: amd64 }
          - { runner: ubuntu-24.04-arm, os: linux,   arch: arm64 }
          - { runner: windows-2025,     os: windows, arch: amd64 }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.meta.outputs.tag }}
      # The toolchain from GitHub releases, exactly as the xl repository installs it
      # (hasirciogluhq/xlang/.github/actions/toolchain): the `xl` tool, the released `xlc` and the
      # stdlib. The released xlc builds this compiler.
      - id: toolchain
        uses: hasirciogluhq/xlang/.github/actions/toolchain@development

      # ld.lld, lld-link, llvm-dlltool and llvm-readobj for the cross-target rows of the e2e run.
      - name: LLVM tools (macOS)
        if: matrix.os == 'darwin'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          set -euo pipefail
          brew install llvm lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
      - name: LLVM tools (Linux)
        if: matrix.os == 'linux'
        uses: ./.github/actions/apt-llvm
        with:
          version: "23"

      - name: Build and test
        shell: bash
        env:
          XLC: ${{ steps.toolchain.outputs.xlc-bin }}
          XLANG_STD: ${{ steps.toolchain.outputs.std }}
        run: |
          set -euo pipefail
          exe=build/xlc
          [ "${{ matrix.os }}" = windows ] && exe=build/xlc.exe
          xl pkg install
          xl build src/main.xl -o "$exe"
          # A release is never built from a failing tree: the e2e run on this OS.
          [ -x "$exe" ] || { echo "error: the xlc binary was not built" >&2; exit 1; }
          if [ "${{ matrix.os }}" = darwin ]; then test/native/run.sh; fi
          test/e2e/run.sh "$exe"

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          exe=build/xlc
          [ "${{ matrix.os }}" = windows ] && exe=build/xlc.exe
          bash scripts/package.sh "$VERSION" "${{ matrix.os }}" "${{ matrix.arch }}" "$exe"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: xlc-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub release
    needs: [meta, build]
    if: ${{ !cancelled() && needs.meta.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          pattern: xlc-*
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cat ./*.sha256 | sort -k2 > checksums.txt
          rm ./*.sha256
          ls -l

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.tag }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Stable releases need every platform that is not experimental: four Unix archives and Windows x64.
          count="$(ls dist/xlc_* | wc -l)"
          if [ "$PRERELEASE" = "false" ] && [ "$count" -lt 5 ]; then
            echo "error: only $count archives built; refusing to publish a stable release" >&2
            exit 1
          fi
          flags=(--generate-notes --title "xlc $TAG")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* "${flags[@]}"
          fi
