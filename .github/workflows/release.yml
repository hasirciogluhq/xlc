name: release

# Builds xlc for macOS, Linux and Windows and publishes a GitHub release.
#
#   v1.2.3        stable release  (latest)
#   v1.2.3-rc.4   preview release (marked "pre-release", never "latest")
#
# The tag must equal the version in xmake.lua. Re-run an existing tag with workflow_dispatch.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v1.0.0-rc.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # LLVM major version for the Linux builds (apt.llvm.org); 20 is the oldest the code supports.
  LLVM_VERSION: "21"

jobs:
  meta:
    name: Resolve tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - id: meta
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "error: tag '$TAG' must be vX.Y.Z (stable) or vX.Y.Z-rc.N (preview)" >&2
            exit 1
          fi
          version="${TAG#v}"
          declared="$(sed -n 's/^local xlc_version = "\(.*\)"$/\1/p' xmake.lua)"
          if [ "$declared" != "$version" ]; then
            echo "error: xmake.lua declares '$declared' but the tag is '$TAG'" >&2
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-rc.* ]] && prerelease=true
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    needs: meta
    runs-on: ${{ matrix.runner }}
    # One failing platform must not cancel the others; the release step decides what to publish.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15,         os: darwin,  arch: arm64 }
          - { runner: macos-15-intel,   os: darwin,  arch: amd64 }
          - { runner: ubuntu-24.04,     os: linux,   arch: amd64 }
          - { runner: ubuntu-24.04-arm, os: linux,   arch: arm64 }
          - { runner: windows-2025,     os: windows, arch: amd64 }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - name: Install dependencies (macOS)
        if: matrix.os == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          brew install llvm zstd lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          # The runner's own Ubuntu mirror is sometimes unreachable and apt would wait on every file of it for minutes: fail fast
          # and carry on, because what is needed is on the image or on apt.llvm.org.
          printf 'Acquire::Retries "1";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' |
            sudo tee /etc/apt/apt.conf.d/99-fail-fast >/dev/null
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends build-essential ca-certificates curl git unzip wget \
            lsb-release software-properties-common gnupg libzstd-dev libffi-dev libncurses-dev zlib1g-dev libxml2-dev
          # The apt.llvm.org repository is added by hand and only the needed packages are installed: `llvm.sh` also installs lldb,
          # whose dependency `libipt2` comes from the Ubuntu mirror.
          codename=$(lsb_release -cs)
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          chosen=""
          for candidate in "${LLVM_VERSION}" 20; do
            echo "deb https://apt.llvm.org/$codename/ llvm-toolchain-$codename-$candidate main" |
              sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
            sudo apt-get update || true
            if sudo apt-get install -y --no-install-recommends "llvm-${candidate}-dev" "clang-${candidate}" "lld-${candidate}"; then
              chosen="$candidate"; break
            fi
            echo "LLVM $candidate is not available; trying the next one"
          done
          [ -n "$chosen" ] || { echo "error: no usable LLVM release found" >&2; exit 1; }
          echo "/usr/lib/llvm-${chosen}/bin" >> "$GITHUB_PATH"

      # Windows is a native MSVC-ABI build: Visual Studio's headers, STL and linker, driven by
      # clang-cl (the code uses `__int128`, which cl.exe does not have). LLVM's static libraries
      # come from conda-forge, which builds them with MSVC.
      - name: Install dependencies (Windows)
        if: matrix.os == 'windows'
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-name: llvm
          create-args: >-
            llvmdev=21
            zstd-static
            zlib
          init-shell: bash
          cache-environment: true

      - name: Visual Studio environment (Windows)
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - uses: xmake-io/github-action-setup-xmake@v1.2.5
        with:
          xmake-version: latest
          # xmake's own caches, one per OS/CPU: downloaded packages (cli11) and compiled objects.
          actions-cache-folder: .xmake-cache
          actions-cache-key: release-${{ matrix.os }}-${{ matrix.arch }}
          package-cache: true
          package-cache-key: release-${{ matrix.os }}-${{ matrix.arch }}
          build-cache: true
          build-cache-key: release-${{ matrix.os }}-${{ matrix.arch }}
          project-path: .

      - name: Build (Unix)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          llvm-config --version
          xmake f -P . -y -m release --policies=build.ccache:y
          xmake -P . -y
          xmake build -P . -y xlc-tests
          # A release is never built from a failing tree: the unit tests and the e2e run on this OS.
          xmake run -P . xlc-tests
          test/e2e/run.sh "$(find build -type f -name xlc | head -n1)"

      - name: Build (Windows)
        if: matrix.os == 'windows'
        shell: bash -el {0}
        run: |
          set -euo pipefail
          export LLVM_CONFIG="$(cygpath -u "$MAMBA_ROOT_PREFIX/envs/llvm/Library/bin/llvm-config.exe")"
          "$LLVM_CONFIG" --version
          xmake f -P . -y -m release --policies=build.ccache:y -p windows -a x64 --toolchain=clang-cl
          xmake -P . -y
          xmake build -P . -y xlc-tests
          xmake run -P . xlc-tests
          test/e2e/run.sh build/windows/x64/release/xlc.exe

      - name: Package (Unix)
        if: matrix.os != 'windows'
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          bin="$(find build -type f -name xlc | head -n1)"
          scripts/package.sh "$VERSION" "${{ matrix.os }}" "${{ matrix.arch }}" "$bin"

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          bin="$(find build -type f -name xlc.exe | head -n1)"
          bash scripts/package.sh "$VERSION" "${{ matrix.os }}" "${{ matrix.arch }}" "$bin"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: xlc-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub release
    needs: [meta, build]
    if: ${{ !cancelled() && needs.meta.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          pattern: xlc-*
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cat ./*.sha256 | sort -k2 > checksums.txt
          rm ./*.sha256
          ls -l

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.tag }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Stable releases need every platform that is not experimental: four Unix archives and Windows x64.
          count="$(ls dist/xlc_* | wc -l)"
          if [ "$PRERELEASE" = "false" ] && [ "$count" -lt 5 ]; then
            echo "error: only $count archives built; refusing to publish a stable release" >&2
            exit 1
          fi
          flags=(--generate-notes --title "xlc $TAG")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* "${flags[@]}"
          fi
