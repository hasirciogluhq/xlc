name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm zstd lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          # LLVM 20 or newer (`Intrinsic::getOrInsertDeclaration`), from apt.llvm.org.
          # The runner's own Ubuntu mirror (azure.archive.ubuntu.com) is sometimes unreachable and apt would wait on every file of
          # it for minutes: fail fast instead, and carry on, because the packages below are on the image or on apt.llvm.org.
          printf 'Acquire::Retries "1";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' |
            sudo tee /etc/apt/apt.conf.d/99-fail-fast >/dev/null
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends wget lsb-release software-properties-common gnupg \
            libzstd-dev libffi-dev libncurses-dev zlib1g-dev libxml2-dev
          # The apt.llvm.org repository is added by hand and only the needed packages are installed: `llvm.sh` also installs lldb,
          # whose dependency `libipt2` comes from the Ubuntu mirror.
          codename=$(lsb_release -cs)
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb https://apt.llvm.org/$codename/ llvm-toolchain-$codename-21 main" |
            sudo tee /etc/apt/sources.list.d/llvm-21.list >/dev/null
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends llvm-21-dev clang-21 lld-21
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
      # Windows: MSVC ABI through clang-cl (the code uses `__int128`), LLVM from conda-forge.
      - name: LLVM (Windows)
        if: runner.os == 'Windows'
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-name: llvm
          create-args: >-
            llvmdev=21
            zstd-static
            zlib
          init-shell: bash
          cache-environment: true
      - name: Visual Studio environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
      - uses: xmake-io/github-action-setup-xmake@v1.2.5
        with:
          xmake-version: latest
          # xmake's own caches, one per OS/CPU: downloaded packages (cli11) and compiled objects.
          actions-cache-folder: .xmake-cache
          actions-cache-key: ci-${{ runner.os }}-${{ runner.arch }}
          package-cache: true
          package-cache-key: ci-${{ runner.os }}-${{ runner.arch }}
          build-cache: true
          build-cache-key: ci-${{ runner.os }}-${{ runner.arch }}
          project-path: .
      - name: Build and test
        if: runner.os != 'Windows'
        run: |
          xmake f -P . -y -m release --policies=build.ccache:y
          xmake -P . -y
          xmake build -P . -y xlc-tests
          # Platform-independent checks (parser, sema, HIR), then the compiler binary on this OS (test/e2e).
          xmake run -P . xlc-tests
          test/e2e/run.sh "$(find build -type f -name xlc | head -n1)"
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: bash -el {0}
        run: |
          export LLVM_CONFIG="$(cygpath -u "$MAMBA_ROOT_PREFIX/envs/llvm/Library/bin/llvm-config.exe")"
          xmake f -P . -y -m release --policies=build.ccache:y -p windows -a x64 --toolchain=clang-cl
          xmake -P . -y
          xmake build -P . -y xlc-tests
          xmake run -P . xlc-tests
          # The compiler itself must start, build and run programs and link only the OS (test/e2e).
          test/e2e/run.sh build/windows/x64/release/xlc.exe
