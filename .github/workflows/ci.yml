name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Every host a release is built on (release.yml): Linux and macOS on x86-64 and arm64, Windows x86-64.
        runner: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
    steps:
      - uses: actions/checkout@v7.0.1
      # The toolchain from GitHub releases, exactly as the xl repository installs it
      # (hasirciogluhq/xlang/.github/actions/toolchain): the `xl` tool, the released `xlc` and the
      # stdlib. The released xlc builds this compiler; the result is then tested.
      - id: toolchain
        uses: hasirciogluhq/xlang/.github/actions/toolchain@development
      # ld.lld, lld-link, llvm-dlltool and llvm-readobj for the cross-target rows of the e2e run.
      - name: LLVM tools (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          brew install llvm lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
      - name: LLVM tools (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-llvm
        with:
          version: "23"
      - name: Compiler comment tags
        # COMPILER-TAGS.md: every tag line must stay collectable with one grep, and the collected
        # view must match the source. The hook stages the view; this fails if it was not run.
        run: |
          ./scripts/tags.sh check
          ./scripts/tags.sh sync
          git diff --exit-code -- COMPILER-TAGS.md
      - name: Build and test
        shell: bash
        env:
          XLC: ${{ steps.toolchain.outputs.xlc-bin }}
          XLANG_STD: ${{ steps.toolchain.outputs.std }}
        run: |
          xl pkg install
          xl build src/main.xl -o build/xlc
          # The binary of this tree, never a fallback: an empty path would test `$XLC`.
          [ -x build/xlc ] || { echo "error: the xlc binary was not built" >&2; exit 1; }
          if [ "$RUNNER_OS" = macOS ]; then test/native/run.sh; fi
          test/e2e/run.sh build/xlc
