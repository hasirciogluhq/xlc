name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - name: LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm zstd
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          # LLVM 20 or newer (`Intrinsic::getOrInsertDeclaration`), from apt.llvm.org.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wget lsb-release software-properties-common gnupg \
            libzstd-dev libffi-dev libncurses-dev zlib1g-dev libxml2-dev
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          sudo apt-get install -y --no-install-recommends llvm-21-dev clang-21
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
      # Windows: MSVC ABI through clang-cl (the code uses `__int128`), LLVM from conda-forge.
      - name: LLVM (Windows)
        if: runner.os == 'Windows'
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: llvm
          create-args: >-
            llvmdev=21
            zstd-static
            zlib
          init-shell: bash
          cache-environment: true
      - name: Visual Studio environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - name: Build and test
        if: runner.os != 'Windows'
        run: |
          xmake f -P . -y -m release
          xmake -P . -y
          xmake build -P . -y xlc-tests
          xmake run -P . xlc-tests || echo "::warning::unit tests failed"
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: bash -el {0}
        run: |
          export LLVM_CONFIG="$(cygpath -u "$MAMBA_ROOT_PREFIX/envs/llvm/Library/bin/llvm-config.exe")"
          "$LLVM_CONFIG" --link-static --system-libs; ls "$(dirname "$LLVM_CONFIG")/../lib" | grep -iE "zstd|zlib"
          xmake f -P . -y -m release -p windows -a x64 --toolchain=clang-cl
          xmake -P . -y
          xmake build -P . -y xlc-tests
          xmake run -P . xlc-tests || echo "::warning::unit tests failed"
